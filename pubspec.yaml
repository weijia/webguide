name: webguide
description: 网页引导助手 - 帮助用户逐步完成网页操作的智能引导工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 网络请求
  dio: ^5.4.0

  # WebView
  webview_flutter: ^4.7.0

  # 数据模型
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # 路由
  go_router: ^13.1.0

  # 安全存储
  flutter_secure_storage: ^9.0.0

  # 路径工具
  path_provider: ^2.1.2

  # UI 工具
  google_fonts: ^6.1.0

  # 文件选择
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/tasks/
    - assets/js/
